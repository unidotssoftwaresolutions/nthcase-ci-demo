<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="build" content="dev">
  <title>Fernwood Goods — Desk Lamp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <span class="brand">Fernwood Goods</span>
    <span id="cart-count" class="cart">Cart (0)</span>
  </header>
  <main>
    <div class="card">
      <div class="picture" aria-hidden="true">💡</div>
      <h1 id="product-name">Desk Lamp</h1>
      <p id="product-price" class="price">$42.00</p>
      <p class="blurb">A warm, dimmable lamp for late-night work.</p>
      <button id="add-to-cart" type="button">Add to cart</button>
      <p id="cart-message" class="message" role="status"></p>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
